<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer Contraseña - AUREALUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/login.css"/>
  <link rel="stylesheet" href="assets/css/auth-header.css"/>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="assets/img/logo/aurea-logo.png" alt="AureaLuxe">
    </a>

    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="ofertas.html">Ofertas</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
    </nav>

    <div class="header-actions">
      <a href="login.html" class="btn-ingresar">Ingresar</a>
      <a href="registro.html" class="btn-registro">Registro</a>
      <a href="carrito.html" class="cart-link">
        <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <h1>Restablecer Contraseña</h1>
    <p>Crea una nueva contraseña para tu cuenta</p>
  </section>

  <section class="login-section">
    <div class="login-card">
      <div class="field">
        <label for="newPassword">Nueva contraseña</label>
        <input type="password" id="newPassword" placeholder="Minimo 6 caracteres"/>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" placeholder="Repite tu nueva contraseña"/>
      </div>

      <button class="btn-login" id="btnResetPassword">Guardar nueva contraseña</button>
      <p class="login-msg" id="resetMsg"></p>

      <p class="login-footer">
        <a href="login.html">Volver a iniciar sesión</a>
      </p>
    </div>
  </section>

  <div class="spacer"></div>

  <footer>
    <div class="footer-bottom">
      <p>© 2024 AUREALUXE. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/auth-header.js"></script>
  <script src="assets/js/carrito-sync.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
